<body>
  <section id="start" class="start">
    <div class="start-card">
      <div class="seal">雨</div><div class="eyebrow">古代青楼经营模拟</div>
      <h1>开个青楼</h1>
      <p>接手一座河边的旧楼，招几个会弹、会跳、会说的人。白天排场子，晚上点红烛。捧一个花魁，笼一城客人，在银子、名声和官府之间来回掂量，把听雨楼开成全城最有名的地方。</p>
      <div class="note">楼里的往来都是成年人自愿。写到帐前为止，帐后只算账。</div>
      <div id="legacyNote" class="note hidden" style="margin-top:10px"></div><div class="actions"><button class="gold" onclick="newGame()">开张</button><button id="continueBtn" class="ghost" onclick="continueGame()">接着开</button><button class="ghost" onclick="openHelp()">怎么玩</button></div>
    </div>
  </section>
  <div id="app" class="app hidden">
    <header class="topbar">
      <div class="brand"><div class="brand-mark">雨</div><div><b>听雨楼</b><small id="hallName">临河旧楼</small></div></div>
      <div class="resourcebar"><div class="resource"><img class="ico" src="assets/新图/图标_银子.webp" alt="" onerror="this.remove()"><div><small>银子</small><b id="resMoney">—</b></div></div><div class="resource"><img class="ico" src="assets/新图/图标_名声.webp" alt="" onerror="this.remove()"><div><small>名声</small><b id="resFame">—</b></div></div><div class="resource"><img class="ico" src="assets/新图/图标_格调.webp" alt="" onerror="this.remove()"><div><small>格调</small><b id="resTaste">—</b></div></div><div class="resource"><img class="ico" src="assets/新图/图标_门路.webp" alt="" onerror="this.remove()"><div><small>门路</small><b id="resNetwork">—</b></div></div></div>
      <div id="clock" class="clock"></div>
      <div class="timectl"><button class="auto" data-auto="0" onclick="setAuto(0)">手动</button><button class="auto" data-auto="1" onclick="setAuto(1)">自动</button><button class="auto" data-auto="2" onclick="setAuto(2)">快</button><button class="primary step" onclick="advance(1)">过一旬 ›</button></div>

        {label:'押 50 两',sub:`门路越广消息越准（现在赢面约 ${Math.min(75,40+Math.round(S.network))}%）`,fn:()=>{if(S.money<50){toast('银子不够。');return false}if(Math.random()*100<Math.min(75,40+S.network)){S.money+=70;S.relations.wanderer+=2;news('龙舟','押中了！净赚 70 两，码头上的江湖人都来道贺。')}else{S.money-=50;news('龙舟','押错了船，50 两打了水漂。')}}},
        {label:'看看热闹',sub:'不押',fn:()=>{S.relations.wanderer+=1;news('龙舟','在码头看了一天龙舟，认识了几个跑船的。游侠交情 +1。')}}],closable:false});
      if(id==='zhongqiu'){let best=S.staff.filter(e=>!e.status).sort((a,b)=>b.wit-a.wit)[0];return openDlg({title:'中秋诗会',html:`<p>${safe(f.text)}几个文人在楼下嚷着要联句，谁来接？</p>`,choices:[
        {label:best?`让${best.name}去接（口才 ${best.wit}）`:'没人有空',sub:'口才够就长脸，不够就丢人',fn:()=>{if(!best)return false;if(best.wit+rnd(0,20)>=80){S.taste+=3;S.fame+=2;S.relations.scholar+=3;news('中秋',`${best.name}接了三轮没接断，文人们直说楼里有人物。格调 +3，名声 +2。`)}else{S.taste=Math.max(0,S.taste-1);news('中秋',`${best.name}接到第二轮就卡住了，文人们笑着走了。格调 -1。`)}}},
        {label:'客气推了',sub:'不接',fn:()=>{news('中秋','说楼里今晚不作诗，文人们喝了杯茶就走了。')}}],closable:false});}
      if(id==='fangbang'){S.network+=2;S.relations.scholar+=2;news('放榜','新科举人结伴来楼里道贺，留了几张名帖。门路 +2，文士交情 +2。');return flushQueue()}
      if(id==='nianguan'){
        let ys=S.yearStats[S.year]||{best:null,shows:{}},bestStaffId=Object.entries(ys.shows).sort((a,b)=>b[1]-a[1])[0]?.[0],bestStaff=bestStaffId&&staff(+bestStaffId),bestAdm=S.admirers.slice().sort((a,b)=>b.level-a.level)[0];
        let html=`<p>${safe(f.text)}</p>`;
        if(ys.best){S.fame+=4;html+=`<div class="hint"><b>年度最叫座</b>：${safe(ys.best.name)}（${ys.best.total} 分）。名声 +4。</div>`}
        if(bestStaff){bestStaff.mood=clamp(bestStaff.mood+15,0,100);S.fame+=2;html+=`<div class="hint" style="margin-top:6px"><b>年度头牌</b>：${safe(bestStaff.name)}，一年上了 ${ys.shows[bestStaffId]} 场。心情 +15，名声 +2。</div>`}
        if(bestAdm){S.money+=100;html+=`<div class="hint" style="margin-top:6px"><b>年度豪客</b>：${safe(bestAdm.name)}，包了个 100 两的大红包。</div>`}
        if(!ys.best&&!bestStaff)html+='<div class="empty">今年没办几场，榜上没咱们。</div>';
        return openDlg({title:'年关 · 风月榜',html,buttons:[{label:'过年',primary:true}]});
      }
      flushQueue();
    },
    bankrupt(){
      openDlg({title:'楼易主了',html:`<p>接连亏空，月钱和楼租都付不出了。债主把旧招牌摘了下来，这一局到这儿。</p><div class="hint">一共办了 ${S.records.length} 场，最高名声 ${Math.round(S.fame)}。</div>`,buttons:[{label:'另起一局',primary:true,fn:()=>{closeDlg(true);S=null;deleteSave()}}],closable:false});
    },
    ending(){
      S.evaluated=true;
      let duel=Math.round(clamp((S.fame-S.rivalFame)*4,-150,200)),value=Math.max(0,S.money+S.fame*18+S.taste*22+S.network*25+Object.values(S.relations).reduce((a,b)=>a+b,0)*3+duel+S.hof.length*60),grade=value>3800?'S':value>2600?'A':value>1600?'B':value>850?'C':'D';
      let insp=S.flags.inspections||0,red=S.flags.redeemed||0,end;
      if(S.heat>=10||insp>=4)end={id:'sealed',title:'封楼',text:'第九年开春，官府贴了封条。艳场子开得太多，留客留得太勤，打点也压不住风声了。楼里的人各自散去，河边只剩一块摘下来的招牌。'};
      else if(grade==='S'||(grade==='A'&&S.fame>=S.rivalFame))end={id:'famous',title:'天下名楼',text:'外地来的人下了船先问听雨楼在哪。醉仙舫的妈妈桑过河来拜年，带的礼比谁都重。这块旧招牌，真让你做成了全城第一。'};
      else if(red>=3)end={id:'scatter',title:'散楼',text:'这些年你放走了一个又一个，喜轿一顶顶从楼门口抬出去。楼还开着，人却没剩几个，倒像个专门送人出嫁的地方。'};
      else if(grade==='A'||grade==='B')end={id:'steady',title:'老字号',text:'不算全城最响，但河边这一片，说起听雨楼没有人不点头。日子过得下去，人也留得住，这就够了。'};
      else end={id:'small',title:'小楼还在',text:'八年过去，楼还是那座楼，人还是那几个人。没发财，也没散，檐下的雨照旧下着。'};
      let people=[[1,'顾清和',e=>bondOf(1,2)+bondOf(1,3)+bondOf(1,4)>=60?'楼里的人都念他的好，年关的时候一起喝到天亮。':'掌柜一个人在账房算了一夜的账。'],[2,'沈月白',e=>!e?'早就不在楼里了。':e.career==='qinxian'?'一手琴弹到全城无人不识，人叫她月白仙子。':S.huakui===2?'做了花魁，倒是把琴放下了。':'还是每晚弹琴，还是弹给听得懂的人。'],[3,'柳如烟',e=>!e?'早就不在楼里了。':S.huakui===3?'花魁的名头一直挂在她身上，城里的公子没有不认识的。':e.career?'带出了一屋子徒弟，自己不大上台了。':'水袖还是那么长，只是跳的时候不怎么笑了。'],[4,'裴九',e=>!e?'早就不在楼里了。':e.career==='muliao'?'如今出入侯府，见掌柜还是照旧作揖。':e.career==='shuoshu'?'成了城里最有名的说书先生，茶馆抢着请。':'段子越讲越多，江湖上的事一半是他编的。']];
      let m=loadMeta();m.runs++;m.best=Math.max(m.best,value);m.found=[...new Set(m.found.concat(S.combosFound))];m.endings=[...new Set(m.endings.concat(end.id))];saveMeta(m);
      openDlg({title:'八年了，算总账',html:`<div class="grade">${grade}</div><h2 style="text-align:center;margin:0">${end.title}</h2><p style="text-align:center">听雨楼值 ${money(value)}</p><div class="hint">${end.text}</div><p>八年办了 ${S.records.length} 场，名楼志 ${S.hof.length} 场，名声 ${Math.round(S.fame)}，格调 ${Math.round(S.taste)}，门路 ${Math.round(S.network)}。${S.fame>=S.rivalFame?`跟醉仙舫斗了八年，到底是咱们赢了一头。`:`对岸醉仙舫到今天还压着咱们一头。`}</p><h3>楼里的人</h3>${people.map(([id,name,fn])=>`<p><b>${name}</b>：${fn(staff(id))}</p>`).join('')}<div class="hint">这是第 ${m.runs} 局，见过 ${m.endings.length}/5 种结局。再开一局会带上 ${money(Math.min(200,m.runs*50))} 人脉钱和 ${m.found.length} 条风月谱旧账。算完账也能接着开。</div>`,buttons:[{label:'另起一局',fn:()=>{closeDlg(true);deleteSave()}},{label:'接着开',primary:true}]});
    }
  };
  function askCombo(){
    if(S.network<20)return toast('门路不够 20，清客打听不出来。');
    let pool=COMBOS.filter(c=>!S.combosFound.includes(c.id)&&!S.combosHinted.includes(c.id));if(!pool.length)return toast('该打听的都打听完了。');
    S.network-=20;let c=pick(pool);S.combosHinted.push(c.id);news('打听',`裴九从茶馆打听回来一条：${c.text}（${c.tier==='C'?'听说会砸':'听说很灵'}）`);save();render();
  }
  const NPC={mama:'assets/新图/npc_醉仙舫妈妈桑.webp',star:'assets/新图/npc_醉仙舫头牌.webp',officer:'assets/新图/npc_巡检.webp'};
  function npcHtml(key,name,text){return `<div class="npc-row">${portraitHtml({name,portrait:NPC[key]},'width:96px;height:128px;flex:none')}<p>${text}</p></div>`}
  function openHelp(){openDlg({title:'怎么玩',html:`<p><b>先看客人，再排场子。</b>文士爱清雅，商贾爱排场，游侠爱痛快，权贵要面子。风向会变，赶上了多赚。</p><p><b>一场戏看四样。</b>好听、好看、撩人、周到，每过一旬各涨一截，涨多少看上台的人。排的时候有 6 点侧重可以分，分到哪样哪样涨得快。演完四位评客各打 10 分：白先生看好听周到，钱东家看好看撩人，铁大哥看撩人好听，王公子看周到好看。加起来 32 分以上进名楼志。客人口味一年比一年刁。</p><p><b>风月谱。</b>什么场子赶上什么风向、让谁上、办多大，配对了有暗加成（S、A 级），配错了倒扣（C 级）。演过才知道，也可以花 20 门路让裴九去打听。同一类场子、同一路客人办得多了会熟练，涨得更快。</p><p><b>场子靠人。</b>琴艺管雅乐，舞艺管歌舞，口才管说书和应变，待客管客人高不高兴，风情管艳场子和过夜。排人的时候两样本事搭着来，比堆一样稳。</p><p><b>别把人用废。</b>连着上台掉体力，歇一旬能缓过来。练本事花钱花体力，涨了不掉。</p><p><b>一年有六个日子。</b>正月灯会、三月花朝花魁大会、五月端午、八月中秋、九月放榜、腊月风月榜。赶上节，对路的场子多赚两三成。花魁大会名声到 10 就能报名，选上了全楼场子好卖，她过夜的礼金也高。</p><p><b>人会长。</b>5 级可以转职，二选一，转了不能改。每个人一条特质，招人的时候看清楚。物件分两种：摆楼里的全楼管用，给人带的要去人物页给她。账房、管事、茶博士不上台，各管一摊。</p><p><b>过夜。</b>只能安排有空、状态好、本人愿意的人，写到帐前为止，帐后只算账。占一旬，她拿 45%，之后要歇两三旬。</p><p><b>楼里的人也有关系。</b>同台演得好关系变好，谁抢了风头、谁当了花魁、谁跟谁看上同一路客人，关系就坏。姐妹同台涨得快，不对付的同台掉一成还会在后台吵起来，结了仇会闹到要走。</p><p><b>老客。</b>过夜之后客人可能上心：月月送东西、包场，迷得太深就会捧着钱来赎身。放不放，你说了算。</p><p><b>交情留得下。</b>每场、每次过夜都会改客人的交情。扩楼要场次、名声和门路够；第九年开头算一次总账，算完还能接着开。</p><p><b>对岸的醉仙舫。</b>他们名声月月涨，压过咱们的时候进账最多少两成二。他们会挖人、打对台。赢对台、办花魁都能压他们。</p><p><b>官府盯着。</b>艳场子和过夜会攒风声，攒多了官府上门：要么花钱打点，要么丢脸。楼租一年比一年贵，别把老本吃光。</p>`,buttons:[{label:'知道了',primary:true}]})}

  /* ===================== 5. 界面 ===================== */
  function showPage(p){page=p;['home','programs','staff','guests','strategy','codex'].forEach(x=>$(`page-${x}`).classList.toggle('hidden',x!==p));document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===p));renderMain()}
  const ico=(name,cls='ico')=>`<img class="${cls}" src="assets/新图/图标_${name}.webp" alt="" onerror="this.remove()">`;
  const GUEST_ICON={scholar:'文士',merchant:'商贾',wanderer:'游侠',noble:'权贵'},DIM_ICON={sound:'好听',look:'好看',flirt:'撩人',care:'周到'},SKILL_ICON={qin:'琴艺',dance:'舞艺',wit:'口才',host:'待客',charm:'风情'},FAC_ICON={stage:'临水歌台',music:'藏谱阁',kitchen:'精膳房',garden:'夜雨小园',carriage:'车马院'},ITEM_ICON={guqin:'古琴',nichang:'霓裳',xiang:'沉水香',mingtie:'名帖',shigao:'前朝诗稿',yanzhi:'胭脂',yupei:'玉佩',pingfeng:'屏风',jiu:'女儿红',gongdeng:'宫灯',xiuxie:'绣鞋',yuxiao:'玉箫'};
  const stampOf=t=>t>=36?'S':t>=32?'A':t>=26?'B':t>=20?'C':'D';
  function imgFail(img){let d=document.createElement('div');d.className='avatar';d.style.cssText=img.style.cssText;d.textContent=(img.alt||'?')[0];img.replaceWith(d)}
  function portraitHtml(e,style=''){return e.portrait?`<img class="portrait" style="${style}" src="${e.portrait}" alt="${safe(e.name)}" onerror="imgFail(this)">`:`<div class="avatar" style="${style}">${safe(e.name[0])}</div>`}
  function statusText(e){let k=e.status?.kind;return k==='program'?'在排场子':k==='rest'?'歇着':k==='study'?'在练功':k==='night'?'今晚留客':e.nightCooldown>0?`缓 ${e.nightCooldown} 旬`:'有空'}
  function statHtml(){let heat=Math.round(S.heat);return `<div class="stats"><div class="card stat">${ico('银子','ico big')}<div><label>银子</label><b>${money(S.money)}</b><small>每月固定开销 ${money(burnOf())}</small></div></div><div class="card stat">${ico('名声','ico big')}<div><label>名声</label><b>${Math.round(S.fame)}</b><small>醉仙舫 ${Math.round(S.rivalFame)}${S.rivalFame>S.fame?' · 压咱们一头':''}</small></div></div><div class="card stat">${ico('格调','ico big')}<div><label>格调</label><b>${Math.round(S.taste)}</b><small>风声 ${heat}${heat>=9?' · 官府盯上了':heat>=6?' · 有点风声':''}</small></div></div><div class="card stat">${ico('门路','ico big')}<div><label>门路</label><b>${Math.round(S.network)}</b><small>开权贵场子、扩楼要用</small></div></div><div class="card stat">${ico('人','ico big')}<div><label>人</label><b>${S.staff.length}/${capOf()}</b><small>${hall().name}${S.huakui?' · 有花魁':''}</small></div></div></div>`}
  function programCard(){let p=S.program,d=prog(p.defId),team=teamOf(p).map(e=>e.name);return `<div class="event-card"><div class="split"><span class="tag red">${d.type}</span><b>${Math.min(100,Math.round(p.progress/p.turns*100))}%</b></div><h3>${d.name}</h3><p>给${GUEST[d.guest].name}看 · ${team.map(safe).join('、')} · 花了 ${money(p.cost)} · 还要 ${Math.max(0,p.turns-p.progress)} 旬</p><div class="dims">${DIM_KEYS.map(k=>`<div class="drow"><span>${ico(DIM_ICON[k])}${DIMS[k]}${p.focus[k]?`<small> +${p.focus[k]}</small>`:''}</span><div class="bar"><i style="width:${Math.min(100,p.q[k])}%"></i></div><b>${Math.round(p.q[k])}</b></div>`).join('')}</div><div class="plog">${p.log.length?p.log.slice(0,4).map(l=>`<div>${safe(l)}</div>`).join(''):'<div class="subtle">还没开始排练，过一旬看看。</div>'}</div></div>`}
  function sceneFigures(){
    let p=S.program;if(!p)return '';let team=teamOf(p),slots=[[16,20],[38,26],[60,20],[80,26],[28,8],[70,8]];
    return team.slice(0,6).map((e,i)=>{let [l,b]=slots[i],line=p.lines[e.id];return `<div class="figure" style="left:${l}%;bottom:${b}%">${line?`<div class="bubble">${safe(line)}</div>`:''}${e.portrait?`<img src="${e.portrait}" alt="${safe(e.name)}" onerror="imgFail(this)">`:`<div class="avatar">${safe(e.name[0])}</div>`}<small>${safe(e.name)}</small></div>`}).join('');
  }
  function nightCard(){if(S.nightVisit){let e=staff(S.nightVisit.staffId);return `<div class="event-card"><span class="tag red">今晚留客</span><h3>${safe(e?.name||'')} · ${GUEST[S.nightVisit.guest].name}</h3><p>红烛点上了，帐子放下一半，她门前今晚不见别的客。天亮算账。</p></div>`}let r=S.nightRecords[0];return r?`<div class="event-card"><span class="tag">上回过夜</span><h3>${safe(r.staff)} · ${GUEST[r.guest].name}</h3><p>楼里净得 ${money(r.net)}，交情 +${r.relation}。 <button onclick="EVENTS.nightReport({id:'${r.id}'})">看账</button></p></div>`:''}
  function renderHome(){$('page-home').innerHTML=statHtml()+`<div class="hall"><section class="card hall-scene" style="background-image:url('${(festivalNow()?.scene)||HALL_SCENES[S.hall]}'),url('assets/听雨楼纯场景-v2.webp')"><div class="scene-head"><div><b>${hall().name}</b><br><small>${S.program?`在排「${prog(S.program.defId).name}」`:S.nightVisit?'今晚有人留客':'今晚还没排东西'}</small></div><span class="tag">${S.hall+1} 阶楼</span></div>${sceneFigures()}<div class="scene-bottom"><b>${S.program?'灯点上了，楼里各忙各的':S.nightVisit?'帖子收了，里头那间房留了盏灯':'雨刚停，台子空着'}</b><p>${S.program?'每过一旬往前走一步，走到一半会出点事，得你拿主意。':'去「排场子」看看今晚能演什么，或者让人歇歇、练练。'}</p></div></section><div class="dashboard"><section class="card section"><h2>今晚</h2>${S.program?programCard():'<div class="empty">没排场子<br><br><button class="primary" onclick="showPage(\'programs\')">去排一场</button></div>'}${nightCard()}</section><section class="card section"><h2>快办</h2><div class="quick"><button onclick="showPage('programs')">排场子</button><button onclick="openRecruit()">招人</button><button onclick="restAll()">都歇歇</button><button onclick="openNight()">留客过夜</button><button class="primary wide" onclick="advance(1)">过一旬 ›</button></div></section></div></div>`}
  function renderPrograms(){$('page-programs').innerHTML=statHtml()+`<section class="card section"><div class="split"><div class="grow"><h2>排场子</h2><p class="subtle">名声是一场一场挣出来的。</p></div><span class="tag">风向：${S.trend.name}</span></div><div class="program-grid">${PROGRAMS.map(d=>{let on=unlocked(d);return `<article class="program"><img class="cover" src="assets/新图/节目_${d.name}.webp" alt="" onerror="this.remove()"><span class="tag ${d.guest===S.trend.guest?'green':''}">${d.type} · 给${GUEST[d.guest].name}看</span><h3>${d.name}</h3><p>${safe(d.desc)}</p><div class="line"><span>${d.need} 人 · ${d.turns} 旬</span><b>${money(d.cost)}</b></div><div class="line"><span>看重：${DIM_KEYS.slice().sort((x,y)=>d.dims[y]-d.dims[x]).slice(0,2).map(k=>DIMS[k]).join('、')}</span><span>熟练 ${MASTERY_LV(S.mastery.type[d.type]||0)}/${MASTERY_LV(S.mastery.guest[d.guest]||0)}</span></div><button class="primary" ${!on||S.program?'disabled':''} onclick="openProgram('${d.id}')">${!on?'还开不了：'+lockText(d):S.program?'已经有场子了':'排这个'}</button></article>`}).join('')}</div></section>`}

  <div id="pwaBanner" class="pwa-banner hidden"></div>
  <script>
  (function(){
    var KEY='tingyu_pwa_install';
    var deferredPrompt=null, armed=false, reloading=false;
    var ua=navigator.userAgent;
    var isSafari=/Safari/.test(ua)&&!/Chrome|Chromium|Edg|OPR/.test(ua);
    var isIOS=/iPad|iPhone|iPod/.test(ua);
    var standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;

    function banner(){return document.getElementById('pwaBanner')}

    function renderOffer(){
      var b=banner(); if(!b) return;
      if(isSafari){
        b.innerHTML='<div><b>装到'+(isIOS?'主屏幕':'程序坞')+'，像 App 一样开</b><small>'+(isIOS?'点下面工具栏的分享按钮 → 添加到主屏幕':'菜单栏「文件」→「添加到程序坞」')+'</small></div><div class="row"><button class="ghost" onclick="pwaDismiss()">知道了</button></div>';
      }else if(deferredPrompt){
        b.innerHTML='<div><b>装到桌面，像 App 一样开</b><small>装完能离线玩，不用每次开浏览器找网址</small></div><div class="row"><button class="ghost" onclick="pwaDismiss()">以后再说</button><button class="gold" onclick="pwaInstall()">装到桌面</button></div>';
      }else{
        return;
      }
      b.classList.remove('hidden');
    }

    window.pwaInstall=async function(){
      var b=banner();
      if(!deferredPrompt){if(b)b.classList.add('hidden');return}
      deferredPrompt.prompt();
      var r=await deferredPrompt.userChoice;
      deferredPrompt=null;
      localStorage.setItem(KEY, r.outcome==='accepted'?'installed':'dismissed');
      if(b)b.classList.add('hidden');
    };
    window.pwaDismiss=function(){localStorage.setItem(KEY,'dismissed');var b=banner();if(b)b.classList.add('hidden')};
    window.pwaManualOffer=function(){
      if(standalone){pwaToast('已经是桌面版了，不用再装');return}
      if(!isSafari&&!deferredPrompt){pwaToast('这个浏览器暂不支持一键安装，可用 Chrome 打开试试');return}
      renderOffer();
    };
    function pwaToast(msg){
      if(typeof toast==='function'){try{toast(msg);return}catch(e){}}
      alert(msg);
    }

    function armOffer(){
      if(armed||standalone) return;
      var st=localStorage.getItem(KEY);
      if(st==='dismissed'||st==='installed') return;
      armed=true;
      setTimeout(renderOffer, 45000);
    }

    addEventListener('beforeinstallprompt', function(e){e.preventDefault();deferredPrompt=e;armOffer()});
    addEventListener('appinstalled', function(){localStorage.setItem(KEY,'installed');var b=banner();if(b)b.classList.add('hidden')});
    if(isSafari) addEventListener('load', armOffer);

    if(location.protocol.indexOf('http')===0 && 'serviceWorker' in navigator){
      addEventListener('load', function(){
        navigator.serviceWorker.register('./sw.js').then(function(reg){
          reg.addEventListener('updatefound', function(){
            var nw=reg.installing;
            if(!nw) return;
            nw.addEventListener('statechange', function(){
              if(nw.state==='installed' && navigator.serviceWorker.controller){
                showUpdateToast(reg);
              }
            });
          });
        }).catch(function(){});
        navigator.serviceWorker.addEventListener('controllerchange', function(){
          if(reloading) return; reloading=true; location.reload();
        });
      });
    }

    function showUpdateToast(reg){
      var b=banner(); if(!b) return;
      window.__pwaWaitingReg=reg;
      b.innerHTML='<div><b>有新版本了</b><small>点一下刷新，接着玩</small></div><div class="row"><button class="gold" onclick="pwaApplyUpdate()">刷新</button></div>';
      b.classList.remove('hidden');
    }
    window.pwaApplyUpdate=function(){
      var reg=window.__pwaWaitingReg;
      if(reg&&reg.waiting) reg.waiting.postMessage('skipWaiting');
      var b=banner(); if(b) b.classList.add('hidden');
    };
  })();
  </script>

  ['gesturestart','gesturechange','gestureend'].forEach(function(t){
    document.addEventListener(t,function(e){e.preventDefault()},{passive:false});
